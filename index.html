<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelving</title>
  <link rel="icon" type="image/x-icon" href="https://mecalpal.github.io/shelving-game/images/shelving-favicon.png">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body id="app">

<!-- TITLE SCREEN -->
<div class="view-title">
  <div class="title-owl-wrapper">
    <div class="owl-animated">
      <div class="left-wing"></div>
      <div class="right-wing"></div>
      <div class="torso"></div>
      <div class="head">
        <div class="eyes"></div>
        <!--<div class="beak"></div>-->
      </div>
    </div>
  </div>
  <h1> The Shelving Game</h1>
  <button target="view-onboarding">Library of Congress Classification</button>
  <button>Dewey Decimal</button>
</div>

<!-- ONBOARDING SCREENS -->
<div class="view-onboarding">
  <h2>Onboarding</h2>
  <div class="talking-owl-wrapper">
    <div class="owl-animated">
      <div class="left-wing"></div>
      <div class="right-wing"></div>
      <div class="torso"></div>
      <div class="head">
        <div class="eyes"></div>
        <div class="beak"></div>
      </div>
    </div>
  </div>
  <p id="onboarding-text"></p>
  <button id="onboarding-next">Next</button>
</div>

<!-- ORIENTATION SCREENS -->
<div class="view-orientation">
  <h2>Orientation</h2>
  <!--<div class="owl-whiteboard-wrapper">
    <div class="whiteboard"></div>-->
    <div class="talking-owl-wrapper">
      <div class="owl-animated">
        <div class="left-wing"></div>
        <div class="right-wing"></div>
        <div class="torso"></div>
        <div class="head">
          <div class="eyes"></div>
          <div class="beak"></div>
        </div>
      </div>
    </div>
  <!--</div>-->
  <p id="orientation-text"></p>
  <button id="orientation-next">Next</button>
</div>

<!-- MODULE OVERVIEW SCREENS -->
<div class="view-module-overview">
  <h2>Overview</h2>
  <div id="overview-cards"></div>
  <button target="view-quiz">Next</button>
</div>


<!-- QUIZ SCREENS -->
<div class="view-quiz">
  <!-- READ SCREENS -->
  <div id="read-section">
    <div id="progress-bar" progress="1"></div>
    <p id="read-eyebrow"></p>
    <h2 id="read-heading"></h2>
    <div id="read-content"></div>
    <button id="read-next">Next</button>
  </div>
  <div id="quiz-section" class="modal-container" style="display:none;">
    <h2 class="quiz-heading">Placeholder</h2>
    <p class="quiz-body">Placeholder</p>
    <ul class="book-container module-quiz"></ul>
    <div id="quiz-message"><button id="quiz-submit">Submit</button></div>
  </div>
</div>

<script type="text/javascript" src="script.js"> </script>
<link rel="stylesheet" type="text/css" href="styles.css">
</body>

</html>
